name: GZ-BT
options:
  minimumXcodeGenVersion: "2.42.0"
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.31.3
  # mlx-swift 0.31.6 ships a PREBUILT Metal library; 0.31.3 compiles Metal from
  # source and would require the (un-bundled, Xcode-26) Metal Toolchain download.
  # Our code calls no mlx-swift API directly — only mlx-swift-lm 2.31.3 (pinned,
  # API-verified) — so this patch bump is safe and keeps builds install-free.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  GZ-BT:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gzbt.app
        PRODUCT_NAME: "GZ-BT"
        PRODUCT_MODULE_NAME: GZBT
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "GZ-BT"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: NO
        # Local/headless dev: ad-hoc "Sign to Run Locally" — no development team required.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

  GZ-BTTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests
    dependencies:
      - target: GZ-BT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gzbt.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        # macOS bundle layout: executable is at Contents/MacOS/<name>, not <name>.
        # XcodeGen's multiplatform default emits the iOS-style path, so override.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GZ-BT.app/Contents/MacOS/GZ-BT"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GZ-BT:
    build:
      targets:
        GZ-BT: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GZ-BTTests
